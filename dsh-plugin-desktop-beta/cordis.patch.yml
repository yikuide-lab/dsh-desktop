# Desktop Host operations compose around the existing Web bundle. Compatibility
# mode keeps upstream ownership of the browser carrier and rendered UI.
- insert:
    - id: desktop-shell
      name: dsh-plugin-desktop-beta
      config:
        mode: compatibility
    - id: desktop-terminal
      name: dsh-plugin-desktop-beta/terminal
      disabled: !!js process.platform === 'linux'
    - id: desktop-diagnostics
      name: dsh-plugin-desktop-beta/diagnostics
    - id: desktop-notifications
      name: dsh-plugin-desktop-beta/notifications
    - id: desktop-pnpm
      name: dsh-plugin-desktop-beta/pnpm
    - id: desktop-profiles
      name: dsh-plugin-desktop-beta/profiles
    - id: desktop-updates
      name: dsh-plugin-desktop-beta/updates
    - id: desktop-workflow
      name: dsh-plugin-desktop-beta/workflow
    - id: desktop-session-import
      name: dsh-plugin-desktop-beta/session-import

# A desktop launch has no terminal operator waiting for the Web readiness line.
- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: true
    trustedHosts: []

# Packaged Electron Host often cannot resolve every active Loader package from
# asar search paths; failing prepare() blocks all official DeepSeek requests
# (including workflow AI design). Omit diagnostic package metadata on Desktop.
- id: plugin-package-inventory-deepseek
  config:
    enabled: false
